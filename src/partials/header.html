<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand" aria-label="Paply" data-i18n-attr="aria-label:common.home_label">
      <img src="/assets/img/paply-logo.webp" width="59" height="32" alt="Paply logo" data-i18n-attr="alt:common.logo_alt">
    </a>
    <nav class="nav-desktop" aria-label="Main">
      <a href="/features/" data-nav="features" data-i18n="nav.features">Features</a>
      <a href="/pricing/" data-nav="pricing" data-i18n="nav.pricing">Pricing</a>
      <a href="/mobile/" data-nav="mobile" data-i18n="nav.mobile">Mobile app</a>
      <a href="/e-invoicing/" data-nav="guide" data-i18n="nav.guide">E-invoicing guide</a>
      <a href="/faq/" data-nav="faq" data-i18n="nav.faq">FAQ</a>
    </nav>
    <div class="header-actions">
      <details class="lang-menu">
        <summary aria-label="Change language" data-i18n-attr="aria-label:common.change_language">
          <svg class="i" width="16" height="16"><use href="#i-globe"/></svg><span data-i18n="common.lang_code">EN</span>
        </summary>
        <div class="lang-list">
          <a href="{{alt:en}}" hreflang="en" lang="en" data-lang-choice="en">English</a>
          <a href="{{alt:sl}}" hreflang="sl" lang="sl" data-lang-choice="sl">Slovenščina</a>
          <a href="{{alt:hr}}" hreflang="hr" lang="hr" data-lang-choice="hr">Hrvatski</a>
        </div>
      </details>
      <a href="{{app}}/login" class="link-signin" data-i18n="common.sign_in">Sign in</a>
      <a href="{{app}}/register" class="btn btn-primary btn-sm header-cta" data-i18n="common.get_started">Get started free</a>
      <button id="mobile-menu-btn" class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu" data-i18n-attr="aria-label:common.menu">
        <svg id="menu-icon-open" class="i" width="20" height="20"><use href="#i-menu"/></svg>
        <svg id="menu-icon-close" class="i hidden" width="20" height="20"><use href="#i-x"/></svg>
      </button>
    </div>
  </div>
  <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile">
    <div class="wrap mobile-menu-inner">
      <a href="/features/" data-nav="features" data-i18n="nav.features">Features</a>
      <a href="/pricing/" data-nav="pricing" data-i18n="nav.pricing">Pricing</a>
      <a href="/mobile/" data-nav="mobile" data-i18n="nav.mobile">Mobile app</a>
      <a href="/e-invoicing/" data-nav="guide" data-i18n="nav.guide">E-invoicing guide</a>
      <a href="/faq/" data-nav="faq" data-i18n="nav.faq">FAQ</a>
      <div class="mobile-langs" aria-label="Language" data-i18n-attr="aria-label:common.language">
        <a href="{{alt:en}}" hreflang="en" lang="en" data-lang-choice="en">EN</a>
        <a href="{{alt:sl}}" hreflang="sl" lang="sl" data-lang-choice="sl">SL</a>
        <a href="{{alt:hr}}" hreflang="hr" lang="hr" data-lang-choice="hr">HR</a>
      </div>
      <div class="mobile-menu-ctas">
        <a href="{{app}}/login" class="btn btn-ghost btn-block" data-i18n="common.sign_in">Sign in</a>
        <a href="{{app}}/register" class="btn btn-primary btn-block" data-i18n="common.get_started">Get started free</a>
      </div>
    </div>
  </nav>
</header>
